oauth2:
  google:
    user-info-uri: https://www.googleapis.com/userinfo/v2/me
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me
  naver:
    user-info-uri: https://openapi.naver.com/v1/nid/me

spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:haru-dongseon;MODE=MySQL
    
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:

jwt:
  secret-key: secret-key
  access:
    expiration: 100000000
  refresh:
    expiration: 10000000000

aws:
  s3:
    region: aaaa
    bucket: aaaa
    image-directory: aaaa
    domain: https://aaa.com/
